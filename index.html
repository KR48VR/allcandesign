<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Can Create. All Can Design.</title>
</head>
<body>
<script>
(async function () {
  var sources = [
    "https://cdn.jsdelivr.net/gh/KR48VR/allcandesign@5762fe2cff9bc4fa68590919a7737c906c2e3dd8/index.html",
    "https://raw.githubusercontent.com/KR48VR/allcandesign/5762fe2cff9bc4fa68590919a7737c906c2e3dd8/index.html"
  ];
  var html = null;
  for (var i = 0; i < sources.length; i++) {
    try {
      var res = await fetch(sources[i]);
      if (res.ok) { html = await res.text(); break; }
    } catch (e) {}
  }
  if (!html || html.indexOf("const projects") === -1) {
    throw new Error("Could not load gallery source");
  }
  var cards = [
    '  { title: "Hidden Masters (高手在民間)", description: "A seven-part video series (about 8 minutes in all) on the film, literature, music, history and pop-culture references hidden in Stephen Chow\'s Kung Fu Hustle (2004) — from Pig Sty Alley as a Cantonese pun on Kowloon Walled City to the masters who look ordinary until they fight.", cluster: "Film & Culture", emoji: "🥋", date: "2026-10-05", tools: ["Claude"], link: "https://claude.ai/artifact/3iSmkqXs2JaetGGvXB2AZa", links: [], image: "images/hidden-masters.png" },\n',
    '  { title: "Kill Bill Reference Reel", description: "A narrated walk through 28 films, TV shows, songs and pieces of history referenced in Kill Bill: Vol. 1 & 2, one at a time — and when each link came to light. Still unspooling.", cluster: "Film & Culture", emoji: "🎬", date: "2026-10-05", tools: ["Claude"], link: "https://claude.ai/artifact/GXh1VeSKW1kn82D6AjEZy9", links: [], image: "images/kill-bill-reference-reel.png" },\n',
    '  { title: "Secret Levels", description: "A game-style set of short maths videos for 15-year-olds that take school topics (such as simultaneous equations → linear algebra) all the way up to today\'s AI, with an XP bar and a tip for teachers.", cluster: "Videos", emoji: "🎮", date: "2026-10-05", tools: ["Claude"], link: "https://claude.ai/artifact/YbWToWcitg4x55Q6kgsdyk", links: [], image: "images/secret-levels.png" },\n',
    '  { title: "Team of bots", description: "A plain page that shows how a leader and a set of AI teammates stay in sync: who does what, what runs every week, how a link becomes a forecast, and which choices stay with you. Built to explain by building — so anyone can see the whole team at a glance.", cluster: "Tools & Dashboards", emoji: "🤖", date: "2026-10-05", tools: ["Grok Bot"], link: "https://kr48vr.github.io/team-of-bots/", links: [], image: "images/team-of-bots.svg" },\n'
  ];
  var prefix = "";
  if (html.indexOf("Hidden Masters") === -1) {
    prefix += cards[0] + cards[1] + cards[2];
  }
  if (html.indexOf("Team of bots") === -1) {
    prefix += cards[3];
  }
  if (prefix) {
    html = html.replace("const projects = [\n", "const projects = [\n" + prefix);
  }
  html = html.replace("46 PROJECTS MAPPED", "50 PROJECTS MAPPED");
  document.open();
  document.write(html);
  document.close();
})().catch(function (err) {
  document.body.innerHTML = "<p style='font-family:sans-serif;padding:2rem;color:#E8ECF1;background:#0B1120'>Could not load gallery: " + String(err) + "</p>";
});
</script>
</body>
</html>
