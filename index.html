<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Can Create. All Can Design.</title>
</head>
<body>
<script>
(async function () {
  var sources = [
    "https://cdn.jsdelivr.net/gh/KR48VR/allcandesign@5762fe2cff9bc4fa68590919a7737c906c2e3dd8/index.html",
    "https://raw.githubusercontent.com/KR48VR/allcandesign/5762fe2cff9bc4fa68590919a7737c906c2e3dd8/index.html"
  ];
  var html = null;
  for (var i = 0; i < sources.length; i++) {
    try {
      var res = await fetch(sources[i]);
      if (res.ok) { html = await res.text(); break; }
    } catch (e) {}
  }
  if (!html || html.indexOf("const projects") === -1) {
    throw new Error("Could not load gallery source");
  }
  var card = '  { title: "Team of bots", description: "A plain page that shows how a leader and a set of AI teammates stay in sync: who does what, what runs every week, how a link becomes a forecast, and which choices stay with you. Built to explain by building — so anyone can see the whole team at a glance.", cluster: "Tools & Dashboards", emoji: "🤖", date: "2026-10-05", tools: ["Grok Bot"], link: "https://kr48vr.github.io/team-of-bots/", links: [], image: "images/team-of-bots.svg" },\n';
  if (html.indexOf("Team of bots") === -1) {
    html = html.replace("const projects = [\n", "const projects = [\n" + card);
  }
  html = html.replace("46 PROJECTS MAPPED", "47 PROJECTS MAPPED");
  document.open();
  document.write(html);
  document.close();
})().catch(function (err) {
  document.body.innerHTML = "<p style='font-family:sans-serif;padding:2rem;color:#E8ECF1;background:#0B1120'>Could not load gallery: " + String(err) + "</p>";
});
</script>
</body>
</html>
