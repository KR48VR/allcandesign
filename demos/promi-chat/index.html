html,body{margin:0;height:100%;overflow:hidden;font-family:NS,'Noto Sans CJK JP','Noto Sans CJK SC',sans-serif;background:linear-gradient(#faeee4,#e6c9d0)}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:0 0}
#cap{position:absolute;top:95px;width:100%;text-align:center;font-weight:700;font-size:46px;color:#3c281e}
#phone{position:absolute;left:110px;top:250px;width:860px;height:1640px;border-radius:90px;background:#191919;box-shadow:10px 25px 50px rgba(0,0,0,.3)}
#screen{position:absolute;left:20px;top:20px;width:820px;height:1600px;border-radius:72px;background:#fff;overflow:hidden}
#hdr{position:absolute;top:0;left:0;right:0;height:170px;background:linear-gradient(#fff 70%,rgba(255,255,255,0));z-index:2}
.time{position:absolute;left:60px;top:22px;font-weight:700;font-size:30px}
.batt{position:absolute;right:100px;top:32px;width:50px;height:26px;border:3px solid #141414;border-radius:8px;box-sizing:border-box}
.circ{position:absolute;top:70px;width:80px;height:80px;border-radius:50%;border:2px solid #e1e1e1;background:#fff;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:40px}
.pill{position:absolute;top:70px;left:295px;width:230px;height:80px;border-radius:40px;border:2px solid #e1e1e1;box-sizing:border-box;display:flex;align-items:center;font-size:34px}
.av{width:50px;height:40px;border-radius:18px;background:#f06e28;margin:0 15px 0 20px;position:relative}
.av:before,.av:after{content:'';position:absolute;top:12px;width:8px;height:8px;border-radius:50%;background:#fff;left:18px}.av:after{left:32px}
#chat{position:absolute;left:0;right:0;top:0;padding:170px 30px 0;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
#view{position:absolute;top:0;left:0;right:0;bottom:130px;overflow:hidden}
.b{max-width:670px;padding:16px 24px 20px;border-radius:30px;font-size:33px;line-height:46px;margin-bottom:22px;box-sizing:border-box;animation:in .35s ease-out}
.b p{margin:0}.b p+p{margin-top:16px}
.u{background:#B9562A;color:#fff;margin-left:auto;width:fit-content}
.p{background:#f2f2f2;color:#141414;width:670px}
.noanim{animation:none}
@keyframes in{from{opacity:0;transform:translateY(40px)}}
.card{width:670px;border:2px solid #e1e1e1;border-radius:30px;padding:18px 12px 12px;box-sizing:border-box;margin-bottom:22px;animation:in .35s ease-out}
.card h4{margin:0 12px 10px;font-size:31px;font-weight:700}
.opt{display:flex;align-items:flex-start;gap:16px;padding:10px 12px;border-radius:18px;font-size:31px;line-height:42px;cursor:pointer}
.opt:hover{background:#faf1ec}.opt i{flex:none;font-style:normal;width:34px;height:34px;margin-top:4px;border-radius:8px;background:#3b82f6;color:#fff;font-weight:700;font-size:26px;line-height:34px;text-align:center}
.opt.sel{background:#fde8dc}.card.done{pointer-events:none}
.dots{width:130px;height:66px;border-radius:30px;background:#f2f2f2;display:flex;gap:14px;align-items:center;justify-content:center;margin-bottom:22px}
