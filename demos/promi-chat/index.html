html,body{margin:0;height:100%;overflow:hidden;font-family:NS,'Noto Sans CJK JP','Noto Sans CJK SC',sans-serif;background:linear-gradient(#faeee4,#e6c9d0)}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:0 0}
#cap{position:absolute;top:95px;width:100%;text-align:center;font-weight:700;font-size:46px;color:#3c281e}
#phone{position:absolute;left:110px;top:250px;width:860px;height:1640px;border-radius:90px;background:#191919;box-shadow:10px 25px 50px rgba(0,0,0,.3)}
#screen{position:absolute;left:20px;top:20px;width:820px;height:1600px;border-radius:72px;background:#fff;overflow:hidden}
#hdr{position:absolute;top:0;left:0;right:0;height:170px;background:linear-gradient(#fff 70%,rgba(255,255,255,0));z-index:2}
.time{position:absolute;left:60px;top:22px;font-weight:700;font-size:30px}
.batt{position:absolute;right:100px;top:32px;width:50px;height:26px;border:3px solid #141414;border-radius:8px;box-sizing:border-box}
.circ{position:absolute;top:70px;width:80px;height:80px;border-radius:50%;border:2px solid #e1e1e1;background:#fff;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:40px}
.pill{position:absolute;top:70px;left:295px;width:230px;height:80px;border-radius:40px;border:2px solid #e1e1e1;box-sizing:border-box;display:flex;align-items:center;font-size:34px}
.av{width:50px;height:40px;border-radius:18px;background:#f06e28;margin:0 15px 0 20px;position:relative}
.av:before,.av:after{content:'';position:absolute;top:12px;width:8px;height:8px;border-radius:50%;background:#fff;left:18px}.av:after{left:32px}
#chat{position:absolute;left:0;right:0;top:0;padding:170px 30px 0;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
#view{position:absolute;top:0;left:0;right:0;bottom:130px;overflow:hidden}
.b{max-width:670px;padding:16px 24px 20px;border-radius:30px;font-size:33px;line-height:46px;margin-bottom:22px;box-sizing:border-box;animation:in .35s ease-out}
.b p{margin:0}.b p+p{margin-top:16px}
.u{background:#B9562A;color:#fff;margin-left:auto;width:fit-content}
.p{background:#f2f2f2;color:#141414;width:670px}
.noanim{animation:none}
@keyframes in{from{opacity:0;transform:translateY(40px)}}
.card{width:670px;border:2px solid #e1e1e1;border-radius:30px;padding:18px 12px 12px;box-sizing:border-box;margin-bottom:22px;animation:in .35s ease-out}
.card h4{margin:0 12px 10px;font-size:31px;font-weight:700}
.opt{display:flex;align-items:flex-start;gap:16px;padding:10px 12px;border-radius:18px;font-size:31px;line-height:42px;cursor:pointer}
.opt:hover{background:#faf1ec}.opt i{flex:none;font-style:normal;width:34px;height:34px;margin-top:4px;border-radius:8px;background:#3b82f6;color:#fff;font-weight:700;font-size:26px;line-height:34px;text-align:center}
.opt.sel{background:#fde8dc}.card.done{pointer-events:none}
.dots{width:130px;height:66px;border-radius:30px;background:#f2f2f2;display:flex;gap:14px;align-items:center;justify-content:center;margin-bottom:22px}

 else if(st[0]=='frame'){h='<div class="frame fresh"><h2>The detail that used to put people off</h2><p>A useful bug report needs exact times, app versions, IDs, screenshots, what was retested and what changed. Finding and assembling all of that by hand is why many people never file.</p><p>King’s '+kMsgs.length+' emails across these 4 tickets carried exactly that detail. His bots pulled it together, so filing took one ask.</p><div class="who3"><div><b>King</b>: complete tickets without the legwork</div><div><b>Support</b>: can escalate on the first reply, with no back-and-forth</div><div><b>Grok Bot</b>: bugs reproduced, fixed and confirmed by retests</div></div>'+legend()+'</div>'}
 else if(st[0]=='end'){h='<div id="t2end" class="fresh"><b>What it shows</b><br>4 tickets, '+kMsgs.length+' detailed emails from King, each drafted with his bots. The support bot replied with a ticket number within 5 minutes every time, and escalated three to a person. Two are confirmed fixed by King’s retests and closed by a person. The other two are known issues under investigation.</div>'+legend()}
 else{const [i,j]=st,t=TK[i];h='<div class="tkh"><div class="tkn"><span>Ticket '+(i+1)+' of 4 · '+t.tag+'</span><span class="no">'+t.no+'</span></div><div class="sj">'+t.sj+'</div>'+ladder(t,j)+'</div><div class="tl">';
  t.steps.slice(0,j+1).forEach((s,jj)=>s.forEach((m,mm)=>{h+=msg(m,jj==j,i+'_'+jj+'_'+mm)}));
  h+='</div>';if(j==t.steps.length-1)h+='<div class="res '+t.res[0]+'">'+(t.res[0]=='ok'?'&#10003; ':'&#9719; ')+t.res[1]+'</div>'}
 t2l.innerHTML=h;document.getElementById('cnt').textContent=n+' / '+(t2steps.length-1);
 const f=t2l.querySelector('.msg.fresh');const sc=document.getElementById('t2');if(f&&f!==t2l.querySelector('.msg'))f.scrollIntoView({block:'start',behavior:'smooth'});else sc.scrollTop=0}
t2l.addEventListener('click',e=>{const b=e.target.closest('.xp');if(!b)return;const p=document.getElementById('fb'+b.dataset.k);const o=p.hidden;p.hidden=!o;b.setAttribute('aria-expanded',o);b.innerHTML=o?'&#9652; Hide full email':'&#9662; Show full email'});
function t2next(){if(t2s<t2steps.length-1)t2go(t2s+1)}function t2prev(){if(t2s>0)t2go(t2s-1)}
function t2key(e){const k=e.key;if(k=='ArrowRight'||k==' '||k=='PageDown'||(k=='Enter'&&!e.target.closest('button'))){e.preventDefault();t2next()}else if(k=='ArrowLeft'||k=='PageUp'||k=='Backspace'){e.preventDefault();t2prev()}else if(k=='Home'||k=='r'||k=='R'){e.preventDefault();t2go(0)}else if(k=='1')setTab(1)}

 if(S.kind=='frame')h+='<div class="frame fresh"><h2>Why this matters</h2><p>Open each old deck, export it, upload it, check it, delete it: tedious work, done here by King’s bot Kondo on his Mac while King does other things.</p><div class="rule">&#128737; Safety rule: add PDFs next to the originals, and delete nothing until the backup is verified. Nothing newer than two months is touched.</div><p class="sm">Built from King’s 10-second screen recording and Kondo’s reports (25 Oct 2026, 12:20pm–1:09pm SGT). Slide content, client names, the folder name and his email are left out.</p></div>';
 else if(S.kind=='now'){const L=(c,t,x)=>'<li><b class="'+c+'">'+t+'</b> '+x+'</li>';h+='<div class="frame fresh"><h2>Where it stands</h2><ul class="now">'+L('d','Done','Found '+D3.inScope+' files ('+D3.olderFiles+' older than 25 Aug 2026, '+D3.olderGB+' GB; '+D3.kept+' recent).')+L('d','Done','Converted 33 decks to PDF, 0 failures.')+L('d','Done','Sent to Drive: copied '+D3.inScope+', '+D3.identicalSkipped+' skipped as identical, '+D3.macCopies+' added as “(Mac copy)”, nothing overwritten.')+L('d','Done','Verified in Drive by name and size: '+D3.verified+' of '+D3.olderFiles+', '+D3.mismatches+' mismatches.')+L('d','Done','Trashed the '+D3.trashed+' older files ('+D3.olderGB+' GB, '+D3.trashFailed+' failed): in the Mac Trash, recoverable for a week, then emptied on King’s say-so.')+L(FREED?'d':'pd',FREED?'Done':'Pending','GB freed: '+freedTxt()+'.')+'</ul><div class="rule">&#9989; Approved by King: “yes do that”, after seeing the full list. &#128737; Safety rule kept: nothing was moved until the backup was verified, and nothing newer than two months is touched: the '+D3.kept+' recent files stay on the Mac, with a backup copy in Drive.</div><div class="rule">&#128257; Repeats '+D3.repeats+': list first, delete only with King’s OK.</div></div>'}
 else if(S.kind=='del')h+='<div class="frame fresh"><h2>Deletion <span class="pend" style="background:'+(FREED?'#2e8b57':'#2f63c7')+'">'+(FREED?'DONE':'IN THE TRASH · RECOVERABLE')+'</span></h2><p>Kondo’s report: '+D3.trashed+' older files moved to the Mac Trash at '+D3.trashedAt+', after the backup was verified. The Trash has '+(D3.trashEmptied?'been emptied.':'<b>not</b> been emptied: King said “'+D3.decision+'”, so Kondo will re-check the files are still in Drive and empty it on '+D3.emptyScheduled+'.')+'</p><ul class="now"><li><b class="d">Before</b> Files in scope on the Mac: '+D3.inScope+'</li><li><b class="d">Trashed</b> Older files in the Mac Trash: '+D3.trashed+' ('+D3.trashFailed+' failed)'+(D3.trashEmptied?'; Trash now emptied':', recoverable until '+D3.emptyScheduled)+'</li><li><b class="d">After</b> Files staying on the Mac: '+D3.kept+' ('+D3.keptGB+' GB)</li><li><b class="'+(FREED?'d':'pd')+'">Freed</b> '+(t=>t[0].toUpperCase()+t.slice(1))(freedTxt())+'</li></ul><div class="rule">&#128737; Trash, not permanent delete. Only the '+D3.olderFiles+' older files; never anything newer.</div><div class="rule">&#128257; Repeats '+D3.repeats+': list first, delete only with King’s OK.</div></div>';
 else if(S.kind=='end')h+='<div id="t2end" class="fresh"><b>What it shows</b><br>One ask, one approval (“yes do that”), and Kondo finds '+D3.inScope+' files, converts all 33 old decks with no failures after recovering from PowerPoint stalls, copies everything to Drive without overwriting anything, pauses when the Mac runs low on disk, verifies all '+D3.verified+' older files by name and size, and only then moves them to the Mac Trash, recoverable for a week, to be emptied on King’s say-so. '+(FREED?D3.gbFreed+' GB freed once the Trash was emptied.':'Emptying is scheduled for '+D3.emptyScheduled+'; the estimate of about '+D3.gbEstimate+' GB back is confirmed only then.')+' It repeats '+D3.repeats+': list first, delete only with King’s OK.</div>';
 else{const shown=T3.slice(0,n+1).filter(x=>!['frame','now','del','end'].includes(x.kind));h+='<div class="tl">'+shown.map((x,i)=>cardFor(x,i==shown.length-1)).join('')+'</div>'}
 t3l.innerHTML=h;t3vid();document.getElementById('cnt').textContent='step '+n+' / '+(T3.length-1);
 const f=t3l.querySelectorAll('.tl .fresh');const sc=document.getElementById('t3');if(f.length&&n>1)f[f.length-1].scrollIntoView({block:'end',behavior:'smooth'});else sc.scrollTop=0}

function t3vid(){const v=document.getElementById('t3v'),b=document.getElementById('t3vb');if(!v||!b)return;const set=()=>{b.innerHTML=v.paused?'&#9654; Play':'&#10074;&#10074; Pause';b.setAttribute('aria-label',v.paused?'Play video':'Pause video')};v.muted=true;v.onplay=set;v.onpause=set;b.onclick=e=>{e.stopPropagation();v.paused?v.play().catch(set):v.pause()};const pr=v.play();if(pr&&pr.catch)pr.catch(set);set()}
function t3next(){if(t3s<T3.length-1)t3go(t3s+1)}function t3prev(){if(t3s>0)t3go(t3s-1)}
function t3key(e){const k=e.key;if((k=='Enter'||k==' ')&&e.target.closest&&e.target.closest('button'))return;if(k=='ArrowRight'||k==' '||k=='PageDown'||k=='Enter'){e.preventDefault();t3next()}else if(k=='ArrowLeft'||k=='PageUp'||k=='Backspace'){e.preventDefault();t3prev()}else if(k=='Home'||k=='r'||k=='R'){e.preventDefault();t3go(0)}}
setTab=function(n){TAB=n;[1,2,3].forEach(i=>{document.body.classList.toggle('tab'+i,n==i&&i>1);document.getElementById('tb'+i).classList.toggle('on',n==i)});if(n==2)t2go(t2s);else if(n==3)t3go(t3s);else upd()};
document.getElementById('tb3').onclick=()=>setTab(3);document.getElementById('t3').addEventListener('click',e=>e.stopPropagation());
addEventListener('keydown',e=>{if(e.shiftKey||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key=='3'&&TAB!=3){e.preventDefault();e.stopImmediatePropagation();setTab(3)}else if(TAB==3&&(e.key=='1'||e.key=='2')){e.preventDefault();e.stopImmediatePropagation();setTab(+e.key)}},true);

const CH=[['Intro',0]];let _o=2;const CHN=['Imagine Extend','Bot handoff','@bot on X','Disk growth'];TK.forEach((t,i)=>{CH.push([CHN[i],_o,i]);_o+=t.steps.length});CH.push(['Summary',t2steps.length-1]);
const pk=document.getElementById('t2pick');pk.innerHTML=CH.map((c,k)=>'<button data-s="'+c[1]+'" title="'+(c.length>2?'Shift+'+(c[2]+1):'')+'">'+(c.length>2?'<span class="n">'+(c[2]+1)+'</span>':'')+c[0]+'</button>').join('');
pk.addEventListener('click',e=>{const b=e.target.closest('button');if(b)t2go(+b.dataset.s)});
function t2lab(n){const st=t2steps[n];if(st[0]=='intro'||st[0]=='frame')return 'Intro · '+(n+1)+'/2';if(st[0]=='end')return 'Summary';return 'Ticket '+(st[0]+1)+' · step '+(st[1]+1)+'/'+TK[st[0]].steps.length}
const _go=t2go;t2go=function(n){_go(n);document.getElementById('cnt').textContent=t2lab(n);const st=t2steps[n];const act=st[0]=='intro'||st[0]=='frame'?0:st[0]=='end'?CH.length-1:st[0]+1;[...pk.children].forEach((b,k)=>{b.classList.toggle('on',k==act);b.setAttribute('aria-pressed',k==act)})};
addEventListener('keydown',e=>{if(TAB==2&&e.shiftKey&&/^Digit[1-4]$/.test(e.code)){e.preventDefault();e.stopImmediatePropagation();t2go(CH[+e.code[5]][1])}},true);




/* ===== TAB 4: Search Console set-up =====
   Source: King's phone chat with his bot (3 screenshots sent 28 Oct 2026), rebuilt as text, word for word.
   Checked live 28 Oct 2026: the verification file and sitemap.xml (home page + 10 share pages) both return 200.
   Status shown is as of the chat: the sitemap row said "Couldn't fetch"; the bot's afternoon recheck is not yet seen. */
const T4S=[["Add site", "Add the site in Search Console"], ["Verification file", "Google gives a small file; bot adds it to the site"], ["Verify", "Bot clicks Verify; Google fetches the file"], ["Sitemap", "Bot submits sitemap.xml"], ["Google reads it", "First fetch can fail for a few hours"]];const T4J=[1, 3, 4, 5, 5];const T4=[{"kind": "frame", "st": "ppppp"}, {"kind": "chat", "st": "rpppp", "m": [["k", ["let's do the sitemap then"]], ["b", ["On it. I'll set up Search Console for the site and submit the sitemap. It will take a few minutes, and I'll tell you if I need anything from you."]], ["b", ["I've started on Search Console. First I'm adding the site and finding out which verification file Google wants. After that I'll add the file to the site and submit the sitemap."]]]}, {"kind": "chat", "st": "rpppp", "m": [["k", ["how do ypu set up the search console?"]], ["b", ["Four steps:", "1. I open Google Search Console in my browser and add your site's address as a property.", "2. Google asks me to prove the site is yours, usually by adding a small verification file to the site. I'll have that file added to the site.", "3. Once the file is live, I click Verify.", "4. Under Sitemaps, I submit sitemap.xml.", "I'm on step 1 now. The only visible change to the site is that one small file, which visitors never see."]]]}, {"kind": "chat", "st": "drppp", "m": [["k", ["ok do you pretty much do everything for me"]], ["b", ["Pretty much, yes. I set up the account, add the verification file to the site, and submit the sitemap. You don't need to do anything for this one. I only stop to ask when something carries real risk, such as sending as you, deleting, spending money or publishing something you haven't approved. I'm adding the verification file to the site now."]]], "note": "The bot answers the question and keeps working. It tells King exactly where it would stop to ask."}, {"kind": "file", "st": "ddrrp", "m": [["b", ["The verification file is now live on the site. I'm clicking Verify in Search Console and submitting the sitemap, which will take a few minutes. I'll tell you once Google confirms both."]]]}, {"kind": "done", "st": "ddddr", "m": [["b", ["Search Console is set up. Google confirmed you own the site, and I submitted the sitemap.", "The sitemap row currently says \"Couldn't fetch\" with 0 pages. That is common in the first hours after a first submission. I opened the sitemap myself and it is live and valid, listing the home page and the 10 share pages, so the problem isn't on our side. I'll check the row again this afternoon and only message you if it's still stuck.", "Please leave the verification file googled17c56a3706cafe4.html in the site. If it's removed, Google drops the verification."]]]}, {"kind": "chat", "st": "ddddr", "m": [["k", ["how did Google confirm i own the site?"]], ["b", ["Google gave us a small file with a unique name, googled17c56a3706cafe4.html. I added it to your site's code and it went live at kr48vr.github.io/film-school-of-life/googled17c56a3706cafe4.html. Then I clicked Verify, and Google fetched that address and found its own line of text inside.", "Only someone who can publish files to that site could have put that file there. Google treats that as proof of ownership. Your Google account is now the owner in Search Console.", "The file is harmless and only holds that one line. It's why I said to leave it in place."]]]}, {"kind": "chat", "st": "ddddr", "m": [["k", ["and where do i access the search console?"]], ["b", ["Go to Google Search Console and sign in with the same Google account you use for Drive. Then pick kr48vr.github.io/film-school-of-life from the property list at the top left. Sitemaps is in the left menu.", "Data will be thin for the first few days, because Google needs time to crawl the pages."]], ["k", ["great!"]]]}, {"kind": "end", "st": "ddddr"}];const T4FILE="googled17c56a3706cafe4.html";

const LBL4={d:'Done',r:'In progress',p:'Pending'};
let t4s=0;const t4l=document.getElementById('t4list');
function bub4(w,ps,fresh,note){const W=WHO[w];return '<div class="msg '+W.c+(fresh?' fresh':'')+'"><div class="av2">'+W.ic+'</div><div class="mb"><div class="mh">'+(w=='b'?'<span class="bdg wb"><i>'+W.ic+'</i>Grok Bot</span>':'<span class="bdg wk"><i>'+W.ic+'</i>King</span>')+'<span class="md">from King\u2019s phone chat</span></div>'+ps.map(p=>'<q>'+e2(p).replace(T4FILE,'<code>'+T4FILE+'</code>')+'</q>').join('<div style="height:8px"></div>')+(note?'<div class="nt">'+note+'</div>':'')+'</div></div>'}
function trk4(st,n){const cur=st.indexOf('r');return '<div class="trk"><button type="button" class="tj'+(n==0?' on':'')+'" data-j="0" aria-label="Jump to intro">Intro</button>'+T4S.map((s,i)=>'<button type="button" class="sg '+(st[i]=='p'?'pd':st[i])+(cur==i?' cur':'')+'" data-j="'+T4J[i]+'" aria-label="Jump to '+s[0]+' ('+LBL4[st[i]]+')"'+(cur==i?' aria-current="step"':'')+'><div class="sn">'+(st[i]=='d'?'\u2713':i+1)+'</div><div class="sl"><b>'+s[0]+'</b><span>'+LBL4[st[i]]+'</span></div></button>').join('<div class="sa">&rarr;</div>')+'<button type="button" class="tj'+(n==T4.length-1?' on':'')+'" data-j="'+(T4.length-1)+'" aria-label="Jump to summary">Summary</button></div>'}
t4l.addEventListener('click',e=>{const b=e.target.closest('[data-j]');if(b)t4go(+b.dataset.j)});
function card4(k,fresh){
 if(k=='file')return '<div class="xpd'+(fresh?' fresh':'')+'"><div class="xh">Verification file <span>(from the bot\u2019s own messages)</span></div><ul class="now"><li>Google issues a small file with a unique name: <code>'+T4FILE+'</code>.</li><li>The bot adds it to the site\u2019s code, and it goes live at <code>kr48vr.github.io/film-school-of-life/'+T4FILE+'</code>.</li><li>The bot clicks Verify. Google fetches that address and finds its own line of text inside.</li></ul><div class="nt">Checked 28 Oct 2026: the file is live and holds that one line, <code>google-site-verification: '+T4FILE+'</code>.</div></div>';
 if(k=='done')return '<div class="xpd'+(fresh?' fresh':'')+'"><div class="xh">Where it stands <span>(bot\u2019s report)</span></div><ul class="now"><li><b class="d">Done</b> Google confirmed King owns the site.</li><li><b class="d">Done</b> Sitemap submitted.</li><li><b class="r">Watching</b> The sitemap row says \u201cCouldn\u2019t fetch\u201d, 0 pages. Common in the first hours. The bot opened the sitemap itself: live and valid, home page plus 10 share pages. It rechecks that afternoon and only messages King if it is still stuck.</li><li><b class="d">Keep</b> The verification file stays in the site, or Google drops the verification.</li></ul><div class="nt">Checked 28 Oct 2026: the sitemap returns 200 and lists 11 pages. The bot\u2019s afternoon recheck is not reflected here.</div></div>';
 return ''}
function t4go(n){t4s=n;const S=T4[n];let h='<h1>Search Console set-up, by chat</h1>'+trk4(S.st,n);
 if(S.kind=='frame')h+='<div class="frame fresh"><h2>Why this matters</h2><p>Getting a new site into Google normally means opening Search Console, adding the site, downloading a verification file, putting it on the site, clicking Verify and submitting a sitemap. Here King says \u201clet\u2019s do the sitemap\u201d and the bot does every step, then explains each one in plain words when asked.</p><div class="rule">&#128737; The bot stops to ask only for real risk: sending as King, deleting, spending money, or publishing something he has not approved.</div><p class="sm">Site: Film School of Life. Real messages from King\u2019s phone chat, word for word, rebuilt as text. Press <b>Next</b> (or &rarr; / Space) to step through.</p></div>';
 else if(S.kind=='end')h+='<div id="t2end" class="fresh"><b>What it shows</b><br>One short ask, and the bot adds the site, gets the verification file live, clicks Verify and submits the sitemap. It answers King\u2019s questions (\u201cwhat do you do?\u201d, \u201chow did Google confirm?\u201d, \u201cwhere do I look?\u201d) in plain words while it works, and it says what to leave alone. It does not hide a rough edge: the sitemap row said \u201cCouldn\u2019t fetch\u201d at first, and the bot says so, explains why it is common, and promises to recheck.</div>';
 else{let items='';for(let i=1;i<=n;i++){const x=T4[i];const last=i==n;
   if(x.m)items+=x.m.map((m,j)=>bub4(m[0],m[1],last&&j==x.m.length-1&&!card4(x.kind,0)||false,j==x.m.length-1?x.note:'')).join('');
   if(x.kind=='file'||x.kind=='done')items+=card4(x.kind,last)}
   h+='<div class="tl">'+items+'</div>'}
 t4l.innerHTML=h;document.getElementById('cnt').textContent='step '+n+' / '+(T4.length-1);
 const f=t4l.querySelectorAll('.tl .fresh');const sc=document.getElementById('t4');if(f.length&&n>1)f[f.length-1].scrollIntoView({block:'end',behavior:'smooth'});else sc.scrollTop=0}
function t4next(){if(t4s<T4.length-1)t4go(t4s+1)}function t4prev(){if(t4s>0)t4go(t4s-1)}
function t4key(e){const k=e.key;if((k=='Enter'||k==' ')&&e.target.closest&&e.target.closest('button'))return;if(k=='ArrowRight'||k==' '||k=='PageDown'||k=='Enter'){e.preventDefault();t4next()}else if(k=='ArrowLeft'||k=='PageUp'||k=='Backspace'){e.preventDefault();t4prev()}else if(k=='Home'||k=='r'||k=='R'){e.preventDefault();t4go(0)}}
