<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a2420" />
    <meta
      name="description"
      content="Teaching blackboard: plot two curves, slice a cube, and turn a sphere with its great circles."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Teaching blackboard" />
    <title>Teaching blackboard</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <script type="module" crossorigin src="./assets/index-Sj6T7xnt.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dw7lbDHM.css">
  </head>
  <body>
    <div id="app">
      <header>
        <div class="title-block">
          <h1>Teaching blackboard</h1>
          <p class="tagline">Graphs, slices, and spheres.</p>
        </div>
        <div class="toolbar">
          <div class="modes" role="group" aria-label="Board">
            <button type="button" data-mode="graph" aria-pressed="true">Graph</button>
            <button type="button" data-mode="cube" aria-pressed="false">Cube</button>
            <button type="button" data-mode="sphere" aria-pressed="false">Sphere</button>
          </div>
          <div class="tools">
            <button type="button" id="chalk-btn" aria-pressed="false">Chalk</button>
            <button type="button" id="walk-btn" aria-pressed="false">Walk through</button>
            <button type="button" id="clear-draw">Clear drawing</button>
            <button type="button" id="clear-all">Clear all</button>
          </div>
        </div>
      </header>
      <main id="board">
        <canvas id="scene" aria-label="Chalkboard"></canvas>
        <canvas id="chalk" aria-label="Chalk drawing"></canvas>
      </main>
      <section id="dock" aria-label="Controls">
        <p id="caption" class="caption" hidden></p>
        <div id="controls-graph">
          <form id="graph-form" autocomplete="off">
            <div class="eq eq-red">
              <label for="eq-red">Red equation</label>
              <input
                id="eq-red"
                type="text"
                spellcheck="false"
                autocapitalize="off"
                enterkeyhint="done"
                value="y = x^2 - 3"
              />
              <div class="chips" role="group" aria-label="Red presets">
                <button type="button" data-target="eq-red" data-eq="y = x^2 - 3">y = x² − 3</button>
                <button type="button" data-target="eq-red" data-eq="y = x^3">y = x³</button>
                <button type="button" data-target="eq-red" data-eq="y = 2x + 1">y = 2x + 1</button>
              </div>
            </div>
            <div class="eq eq-cyan">
              <label for="eq-cyan">Cyan equation</label>
              <input
                id="eq-cyan"
                type="text"
                spellcheck="false"
                autocapitalize="off"
                enterkeyhint="done"
                value="y = A*sin(x) + B"
              />
              <div class="chips" role="group" aria-label="Cyan presets">
                <button type="button" data-target="eq-cyan" data-eq="y = A*sin(x) + B">y = A·sin(x) + B</button>
                <button type="button" data-target="eq-cyan" data-eq="y = 1/x">y = 1/x</button>
                <button type="button" data-target="eq-cyan" data-eq="y = A*cos(x)">y = A·cos(x)</button>
              </div>
            </div>
            <div class="sliders">
              <label class="slider" id="slider-a">
                <span>A <output id="a-val" for="param-a">2</output></span>
                <input id="param-a" type="range" min="-5" max="5" step="0.1" value="2" />
              </label>
              <label class="slider" id="slider-b">
                <span>B <output id="b-val" for="param-b">1</output></span>
                <input id="param-b" type="range" min="-5" max="5" step="0.1" value="1" />
              </label>
            </div>
            <div class="form-actions">
              <button type="submit" id="graph-btn">Graph</button>
            </div>
            <p id="eq-error" class="error" role="alert"></p>
          </form>
        </div>
        <div id="controls-cube" hidden>
          <p class="hint" id="vertex-readout">Drag to turn the cube. Tap a corner — coordinates run from −1 to 1.</p>
          <div class="control-row">
            <span class="control-label">Cut shape</span>
            <div class="chips" role="group" aria-label="Cut shape">
              <button type="button" data-shape="triangle" aria-pressed="false">Triangle</button>
              <button type="button" data-shape="square" aria-pressed="false">Square</button>
              <button type="button" data-shape="rectangle" aria-pressed="false">Rectangle</button>
              <button type="button" data-shape="pentagon" aria-pressed="false">Pentagon</button>
              <button type="button" data-shape="hexagon" aria-pressed="true">Hexagon</button>
            </div>
          </div>
          <div class="control-row">
            <span class="control-label">Plane</span>
            <div class="chips" role="group" aria-label="Plane direction">
              <button type="button" data-direction="face" aria-pressed="false">Parallel to a face</button>
              <button type="button" data-direction="edges" aria-pressed="false">Through opposite edges</button>
              <button type="button" data-direction="tilt" aria-pressed="false">Uneven tilt</button>
              <button type="button" data-direction="diagonal" aria-pressed="true">Square to the long diagonal</button>
            </div>
          </div>
          <label class="slider" for="cut-slider">
            <span>Cut <output id="cut-val" for="cut-slider">0</output></span>
            <input id="cut-slider" type="range" min="-100" max="100" step="1" value="0" />
          </label>
        </div>
        <div id="controls-sphere" hidden>
          <p class="hint">Drag the sphere to turn it. Red, green, and blue are the great circles xy, yz, and zx.</p>
        </div>
        <div id="explain" class="card" aria-label="Explanation"></div>
      </section>
    </div>
  </body>
</html>
